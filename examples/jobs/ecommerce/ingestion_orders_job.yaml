kind: LinearJob
name: ingestion_orders_job
description: |
  Minimal example job demonstrating a local Spark pipeline that writes
  a managed Iceberg table in Databricks Unity Catalog, without Databricks Connect.

owner: data@tiozin.com
maintainer: tiozin
cost_center: tio_scrooge
labels:
  catalog: tiozin

org: tiozin
region: eu
domain: ecommerce
subdomain: sales
layer: raw
product: storefront
model: orders

runner:
  kind: DatabricksExternalRunner
  format: iceberg
  catalog: tiozin
  jars_packages:
    - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.7.1

inputs:
  - kind: SparkFileInput
    name: load_orders
    description: Order transactions from source system.
    path: examples/data/ecommerce/orders.csv
    format: csv
    header: true
    inferSchema: true
    schema_subject: auto

transforms:
  - kind: SparkSqlTransform
    name: add_metadata
    description: Adds ingestion metadata
    query: |-
      SELECT
          *,
          '{{job.run_id}}'       AS _{{layer}}_run_id,
          '{{job.nominal_time}}' AS _{{layer}}_nominal_date,
          current_timestamp()    AS _{{layer}}_created_at,
          created_at             AS _source_created_at
      FROM @data

outputs:
  - kind: SparkTableOutput
    name: save_orders
    description: Raw order data as a Unity Catalog managed table.
    table: tiozin.default.{{layer}}_{{product}}_{{model}}
    format: iceberg
    mode: merge
    merge_keys: id
    merge_exclude_fields:
      - created_at
      - _{{layer}}_created_at
    partition_by: days(created_at)
