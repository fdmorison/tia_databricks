kind: LinearJob
name: refined_loverscomplaint_job
description: |
  Produces word count metrics for A Lover's Complaint as a refined data product.
  Runs inside a Databricks cluster through Databricks Connect, reading and
  writing Unity Catalog tables.

owner: literature@tiozin.com
maintainer: tiozin
cost_center: tio_scrooge
labels:
  catalog: data_platform

org: tiozin
region: latam
domain: literature
subdomain: classics
product: shakespeare
model: loverscomplaint
layer: refined

runner:
  kind: DatabricksConnectRunner
  host: "{{ ENV.DATABRICKS_HOST }}"
  cluster_id: "{{ ENV.DATABRICKS_CLUSTER_ID }}"
  client_id: "{{ ENV.DATABRICKS_CLIENT_ID }}"
  client_secret: "{{ ENV.DATABRICKS_CLIENT_SECRET }}"

inputs:
  - kind: SparkTableInput
    name: load_poems
    description: Shakespeare source texts from raw layer.
    layer: raw
    model: shakespeare
    table: data_platform.default.{{layer}}_{{product}}_{{model}}

transforms:
  - kind: SparkSqlTransform
    name: select_work
    description: Keeps only the lines of A Lover's Complaint.
    query: SELECT value FROM @data WHERE filestem = 'loverscomplaint'

  - kind: SparkWordCountTransform
    name: count_words
    content_field: value
    lowercase: true

outputs:
  - kind: SparkTableOutput
    name: save_word_counts
    description: Word counts of A Lover's Complaint.
    table: data_platform.default.{{layer}}_{{product}}_{{model}}
    format: iceberg
    mode: truncate
