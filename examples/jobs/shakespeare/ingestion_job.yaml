kind: LinearJob
name: ingestion_shakespeare_job
description: |
  Ingests Shakespeare source texts into a managed Iceberg table in
  Databricks Unity Catalog, running Spark locally without Databricks Connect.

owner: literature@tiozin.com
maintainer: tiozin
cost_center: tio_scrooge
labels:
  catalog: tiozin

org: tiozin
region: latam
domain: literature
subdomain: classics
product: shakespeare
model: shakespeare
layer: raw

runner:
  kind: DatabricksExternalRunner
  format: iceberg
  catalog: tiozin
  jars_packages:
    - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.7.1

inputs:
  - kind: SparkFileInput
    name: load_poems
    description: Shakespeare source texts, one file per work.
    path: examples/data/{{product}}
    format: text
    explode_filepath: true
    schema_subject: auto

outputs:
  - kind: SparkTableOutput
    name: save_poems
    description: Raw Shakespeare texts as a Unity Catalog managed table.
    table: tiozin.default.{{layer}}_{{product}}_{{model}}
    format: iceberg
    mode: overwrite
    partition_by: filestem
