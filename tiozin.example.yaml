registries:

  job:
    kind: FileJobRegistry
    description: File-based job registry for local development
    location: examples/jobs
    timeout: 5
    readonly: false
    cache: false
    failfast: false

  secret:
    kind: EnvSecretRegistry
    description: Secret registry for credentials and sensitive configuration
    timeout: 5
    readonly: false
    cache: false
    failfast: true

  schema:
    kind: FileSchemaRegistry
    description: File-based schema registry for local development
    location: examples/schemas
    timeout: 5
    readonly: false
    cache: false
    failfast: false
    subject_template: "{{org}}.{{region}}.{{domain}}.{{subdomain}}.{{layer}}.{{product}}.{{model}}"

  lineage:
    kind: NoOpLineageRegistry
    description: Lineage registry for tracking data pipeline provenance
    location: http://localhost:5000
    timeout: 5
    readonly: false
    cache: false
    failfast: false
    emit_level: job

  batch:
    kind: NoOpBatchRegistry
    description: Batch registry for job execution control
    timeout: 5
    readonly: false
    cache: false
    failfast: true

  metric:
    kind: NoOpMetricRegistry
    description: Metric registry for job observability and monitoring
    timeout: 5
    readonly: false
    cache: false
    failfast: false

runtime_defaults:

  - kind: DatabricksConnectRunner
    streaming: false
    log_level: WARN
    host: "{{ ENV.DATABRICKS_HOST }}"
    cluster_id: "{{ ENV.DATABRICKS_CLUSTER_ID }}"
    client_id: "{{ ENV.DATABRICKS_CLIENT_ID }}"
    client_secret: "{{ ENV.DATABRICKS_CLIENT_SECRET }}"

  - kind: DatabricksExternalRunner
    streaming: false
    log_level: WARN
    host: "{{ ENV.DATABRICKS_HOST }}"
    client_id: "{{ ENV.DATABRICKS_CLIENT_ID }}"
    client_secret: "{{ ENV.DATABRICKS_CLIENT_SECRET }}"

  - kind: SparkRunner
    streaming: false
    log_level: "{{ ENV.LOG_LEVEL | default('WARN') }}"

  - kind: SparkFileInput
    format: parquet
    schema_subject: auto

  - kind: SparkTableInput
    schema_subject: auto

  - kind: SparkFileOutput
    format: parquet
    mode: append
    schema_subject: auto

  - kind: SparkTableOutput
    schema_subject: auto

  - kind: SparkWordCountTransform
    content_field: value
    lowercase: true
