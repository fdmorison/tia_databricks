[project]
name = "tia_databricks"
version = "0.0.0"
description = "Databricks family for Tiozin, your friendly ETL framework"
readme = "README.md"
requires-python = ">=3.11"

license = "MPL-2.0"
authors = [
  { name = "Fabricio D'Morison", email = "fabricio.dmorison@gmail.com" }
]

keywords = ["etl", "data", "pipeline", "framework", "tiozin", "databricks", "spark"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]

# databricks-connect ships its own pyspark, so tiozin[tio_spark] must not be installed alongside it
dependencies = [
  "tiozin[tio_kernel] >=4.0.0,<5.0.0",
  "databricks-sdk ~=0.102.0",
  "databricks-connect >=15.4.0,<17.0.0",
]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]
test = [
  "pytest ==8.4.2",
  "pytest-cov ==7.0.0",
  "assertpy ==1.1",
]
lint = [
  "ruff ==0.14.10",
  "pre-commit ==4.3.0",
]

[project.entry-points."tiozin.family"]
tia_databricks = "families.tia_databricks"

[project.urls]
Homepage = "https://github.com/fdmorison/tia_databricks"
Repository = "https://github.com/fdmorison/tia_databricks"
Issues = "https://github.com/fdmorison/tia_databricks/issues"

[tool.uv]
required-version = ">=0.8.1"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov --cov-report term"

[tool.coverage.run]
source = ["families"]
omit = [
  "families/**/__init__.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "B021", "B017"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.isort]
known-first-party = ["families"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["families"]

[tool.hatch.build.targets.sdist]
only-include = [
  "families",
  "README.md",
  "pyproject.toml"
]
